<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dave's V.I.F. Program</title>
<style>
  @import url('https://googleapis.com');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0c0c0c;color:#f0f0f0;font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;padding-bottom:60px;min-height:100vh;}
  button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none;}
  .bebas{font-family:'Bebas Neue',sans-serif;}
  
  /* PHASE COLORS */
  .p1-theme { --c: #e8ff47; }
  .p2-theme { --c: #00f2ff; }
  .p3-theme { --c: #ff4785; }

  #header{background:#111;padding:18px 16px 12px;border-bottom:3px solid var(--c);}
  .phase-tabs{display:flex;gap:6px;margin-top:14px;}
  .phase-tab{flex:1;padding:8px 4px;border-radius:7px;font-size:10px;font-weight:700;background:#222;color:#777;}
  .phase-tab.active{background:var(--c);color:#000;}
  
  .week-tabs{display:flex;gap:5px;margin-top:8px;overflow-x: auto;padding-bottom: 5px;}
  .week-tab{flex:0 0 45px;padding:6px 0;border-radius:6px;font-size:11px;font-weight:600;background:transparent;color:#555;}
  .week-tab.active{background:#333;color:#fff;}

  #progress-wrap{padding:12px 16px 10px;background:#111;}
  #progress-bar-bg{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:6px;}
  #progress-bar{height:100%;background:var(--c);border-radius:3px;transition:width .3s;width:0%;}

  .day-tabs{display:flex;background:#111;border-top:1px solid rgba(255,255,255,.06);}
  .day-tab{flex:1;padding:12px 4px;font-size:11px;font-weight:700;color:#555;text-align:center;}
  .day-tab.active{color:var(--c);border-bottom:2.5px solid var(--c);}

  #exercises{padding:14px 16px;}
  .ex-card{margin-bottom:12px;background:rgba(255,255,255,.04);border-radius:12px;overflow:hidden;}
  .ex-header{padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .ex-header:active{background:rgba(255,255,255,.08);}
  .ex-name{font-weight:700;font-size:15px;color:#eee;}
  .ex-body{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.05);}
  .ex-body.open{display:block;}

  .set-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .set-btn{width:42px;height:42px;border-radius:8px;background:#222;color:#fff;font-weight:700;font-size:14px;}
  .set-btn.done{background:var(--c);color:#000;}
  .set-input{background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;width:110px;text-align:center;font-weight:700;}

  .yt-btn{display:inline-flex;align-items:center;padding:8px 14px;background:#ff0000;color:#fff;border-radius:8px;font-size:11px;font-weight:700;text-decoration:none;margin-top:10px;}
  .add-set{background:rgba(255,255,255,0.05);color:var(--c);font-size:10px;font-weight:700;border:1px solid var(--c);padding:4px 10px;border-radius:6px;}

  #timer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;flex-direction:column;align-items:center;justify-content:center;}
  #timer-overlay.show{display:flex;}
  #t-secs{font-size:110px;color:var(--c);line-height:1;}
  
  .admin-btns{display:flex;justify-content:space-between;padding:8px 16px;background:#0c0c0c;}
  .btn-reset{background:none;color:#444;font-size:10px;font-weight:700;letter-spacing:1px;}
</style>
</head>
<body id="main-body" class="p1-theme">

<div id="timer-overlay">
  <div class="bebas" style="letter-spacing:4px; color:#666; margin-bottom:10px;">REST TIME</div>
  <div id="t-secs" class="bebas">60</div>
  <div class="bebas" style="color:#444; margin-top:10px; font-size:20px;">SECONDS</div>
  <button onclick="stopTimer()" style="background:rgba(255,255,255,0.1); color:#fff; padding:12px 30px; border-radius:10px; margin-top:30px; font-weight:700;">SKIP</button>
</div>

<div id="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="width:6px;height:35px;background:var(--c);border-radius:3px;"></div>
    <div>
      <div id="phase-label" class="bebas" style="font-size:11px; color:var(--c); letter-spacing:2px;">PHASE 1: VOLUME</div>
      <div id="week-day-title" class="bebas" style="font-size:26px; letter-spacing:1px;">WEEK 1 - DAY 1</div>
    </div>
  </div>
  <div class="phase-tabs">
    <button class="phase-tab p-btn" id="p-btn-1" onclick="setPhase(1)">F1</button>
    <button class="phase-tab p-btn" id="p-btn-2" onclick="setPhase(2)">F2</button>
    <button class="phase-tab p-btn" id="p-btn-3" onclick="setPhase(3)">F3</button>
  </div>
  <div class="week-tabs" id="week-container"></div>
</div>

<div class="admin-btns">
    <button class="btn-reset" onclick="resetToday()">RESET DAY CHECKS</button>
    <button class="btn-reset" style="color:#844" onclick="resetAll()">CLEAR ALL HISTORY</button>
</div>

<div id="progress-bar-bg"><div id="progress-bar"></div></div>

<div class="day-tabs">
  <div class="day-tab d-btn" id="d-btn-1" onclick="setDay(1)">DAY 1</div>
  <div class="day-tab d-btn" id="d-btn-2" onclick="setDay(2)">DAY 2</div>
  <div class="day-tab d-btn" id="d-btn-3" onclick="setDay(3)">DAY 3</div>
  <div class="day-tab d-btn" id="d-btn-4" onclick="setDay(4)">DAY 4</div>
</div>

<div id="exercises"></div>

<script>
// --- FULL DATA (PHASES 1, 2, 3) ---

  p1: { name: "PHASE 1: VOLUME", weeks: [1,2,3,4], color: "#e8ff47", days: {

      {n: "Hyperextensions", s: 2, r: "10", yt: "5_EJEtllaiQ"},
      {n: "Upright Rows", s: 2, r: "10", yt: "um3VVzqunPU"},
      {n: "Dumbbell Shrugs", s: 2, r: "10", yt: "g6qbq4i1k8A"}
    ]},
    2: { title: "CHEST & SHOULDERS", ex: [
      {n: "Bench Press", s: 2, r: "10", yt: "rT7DgCr-3pg"},
      {n: "Incline DB Press", s: 2, r: "10", yt: "8iPEn5Jg02E"},
      {n: "Decline Pushups", s: 2, r: "AMAP", yt: "SKPab2YC8BE"},
      {n: "DB Military Press", s: 2, r: "10", yt: "B-aVuyhvLHU"},
      {n: "DB Rear Laterals", s: 2, r: "10", yt: "6yMdhi2DVao"}
    ]},
    3: { title: "LEGS", ex: [
      {n: "Squat", s: 2, r: "10", yt: "SW_C1A-rejs"},
      {n: "Leg Press", s: 2, r: "10", yt: "IZxyjW7MPJQ"},
      {n: "Stiff Leg Deadlift", s: 2, r: "10", yt: "jTMmrh727bw"},
      {n: "DB Step Ups", s: 2, r: "10", yt: "9ZKnX6_p76A"},
      {n: "Standing Calf Raise", s: 2, r: "10", yt: "YMmgq6Pa9Co"}
    ]},
    4: { title: "ARMS", ex: [
      {n: "Barbell Curls", s: 2, r: "10", yt: "QZEqB6wOLzQ"},
      {n: "Close Grip Bench", s: 2, r: "10", yt: "nEF0bv2FW94"},
      {n: "Lying Tricep Ext", s: 2, r: "10", yt: "mU_O_gBfUog"},
      {n: "Standing DB Curls", s: 2, r: "10", yt: "ykJmrZ5v0Z0"},
      {n: "Preacher Curls", s: 2, r: "10", yt: "vngli9L6QU0"},
      {n: "Tricep Kickbacks", s: 2, r: "10", yt: "6SS6K3lAwZ8"}
    ]}
  }},
  p2: { name: "PHASE 2: INTENSITY", weeks: [5,6,7,8], color: "#00f2ff", days: {
    1: { title: "UPPER BODY", ex: [
      {n: "Pull Ups", s: 3, r: "AMAP", yt: "eGo4IYlbE5g"},
      {n: "Bench Press", s: 3, r: "8", yt: "rT7DgCr-3pg"},
      {n: "Military Press", s: 3, r: "8", yt: "B-aVuyhvLHU"},
      {n: "Barbell Shrug", s: 3, r: "8", yt: "fO_p3UatpB8"},
      {n: "Lying Tricep Ext", s: 3, r: "8", yt: "mU_O_gBfUog"},

    ]},
    2: { title: "LOWER BODY", ex: [

      {n: "Seated Calf Raise", s: 3, r: "8", yt: "857_m6m_e9M"},

    ]},
    3: { title: "UPPER BODY B", ex: [
      {n: "Lat Pull Downs", s: 3, r: "8", yt: "CAwf7n6Luuc"},
      {n: "Incline Bench", s: 3, r: "8", yt: "SrqOu55lrYU"},
      {n: "Arnold Press", s: 3, r: "8", yt: "6VZG-P1at_Y"},
      {n: "DB Shrugs", s: 3, r: "8", yt: "g6qbq4i1k8A"},
      {n: "DB Tricep Ext", s: 3, r: "8", yt: "nRiJXaySEJ4"},
      {n: "Incline DB Curls", s: 3, r: "8", yt: "s_q-Yf7nN3U"}
    ]},
    4: { title: "LOWER BODY B", ex: [
      {n: "Leg Press", s: 3, r: "8", yt: "IZxyjW7MPJQ"},
      {n: "DB Lunges", s: 3, r: "8", yt: "D7KaRcUTQeE"},
      {n: "Standing Calf Raise", s: 3, r: "8", yt: "YMmgq6Pa9Co"},
      {n: "Knee Raise w/ Ball", s: 3, r: "8", yt: "E_vN3K-aG4A"},
      {n: "Reverse Crunch", s: 3, r: "8", yt: "hyv14e2QDqA"}
    ]}
  }},
  p3: { name: "PHASE 3: FREQUENCY", weeks: [9,10,11,12], color: "#ff4785", days: {
    1: { title: "FULL BODY A", ex: [
      {n: "Squats", s: 2, r: "6", yt: "SW_C1A-rejs"},
      {n: "Stiff Leg Deadlift", s: 2, r: "6", yt: "jTMmrh727bw"},
      {n: "Seated Calf Raise", s: 2, r: "6", yt: "857_m6m_e9M"},
      {n: "Seated Cable Row", s: 2, r: "6", yt: "GZbfZ033f74"},
      {n: "DB Bench Press", s: 2, r: "6", yt: "rX9M6f525E0"}
    ]},
    2: { title: "FULL BODY B", ex: [
      {n: "Leg Press", s: 2, r: "10", yt: "IZxyjW7MPJQ"},
      {n: "Leg Curls", s: 2, r: "10", yt: "1Tq3QdIUlkY"},
      {n: "One Arm DB Row", s: 2, r: "10", yt: "dFzUjPUa8ok"},

    ]},
    3: { title: "FULL BODY C", ex: [

      {n: "DB Step Ups", s: 2, r: "12", yt: "9ZKnX6_p76A"},
      {n: "Barbell Bench", s: 2, r: "12", yt: "rT7DgCr-3pg"}
    ]}
  }}
};

let currentPhase = parseInt(localStorage.getItem('f_phase')) || 1;
let currentWeek = parseInt(localStorage.getItem('f_week')) || 1;
let currentDay = parseInt(localStorage.getItem('f_day')) || 1;
let timerInt;

function setPhase(p) {
  currentPhase = p;
  const phaseData = workoutData['p'+p];
  currentWeek = phaseData.weeks[0];
  localStorage.setItem('f_phase', p);
  localStorage.setItem('f_week', currentWeek);
  updateUI();
}

function setWeek(w) {
  currentWeek = w;
  localStorage.setItem('f_week', w);
  updateUI();
}

function setDay(d) {
  currentDay = d;
  localStorage.setItem('f_day', d);
  updateUI();
}

function updateUI() {
  const pData = workoutData['p'+currentPhase];
  document.getElementById('main-body').className = 'p'+currentPhase+'-theme';
  document.getElementById('phase-label').innerText = pData.name;
  document.getElementById('week-day-title').innerText = `WEEK ${currentWeek} - DAY ${currentDay}`;

  // Tabs
  document.querySelectorAll('.p-btn').forEach((b,i)=> b.classList.toggle('active', i+1 === currentPhase));
  document.querySelectorAll('.d-btn').forEach((b,i)=> b.classList.toggle('active', i+1 === currentDay));

  // Weeks
  const weekCont = document.getElementById('week-container');
  weekCont.innerHTML = pData.weeks.map(w => `<button class="week-tab ${w===currentWeek?'active':''}" onclick="setWeek(${w})">W${w}</button>`).join('');

  renderExercises();
}

function renderExercises() {
  const container = document.getElementById('exercises');
  const day = workoutData['p'+currentPhase].days[currentDay];
  
  if(!day) {
    container.innerHTML = `<div style="text-align:center; padding:50px; color:#444;">REST DAY</div>`;
    return;
  }

  container.innerHTML = day.ex.map((ex, exIdx) => {
    const extraKey = `f_p${currentPhase}w${currentWeek}d${currentDay}e${exIdx}_extras`;
    const extras = parseInt(localStorage.getItem(extraKey)) || 0;
    const totalSets = ex.s + extras;

    return `
      <div class="ex-card">
        <div class="ex-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span class="ex-name">${ex.n} <small style="color:#666; margin-left:8px;">${ex.r} Reps</small></span>
          <span style="font-size:12px; color:#444">▼</span>
        </div>
        <div class="ex-body">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <a href="https://youtube.com{ex.yt}" target="_blank" class="yt-btn">VIDEO GUIDE</a>
            <button class="add-set" onclick="addSet(${exIdx})">+ ADD SET</button>
          </div>
          ${Array.from({length: totalSets}).map((_, sIdx) => {
            const id = `f_p${currentPhase}w${currentWeek}d${currentDay}e${exIdx}s${sIdx}`;
            const isDone = localStorage.getItem(id + '_done') === 'true';
            const weight = localStorage.getItem(id + '_val') || '';
            return `
              <div class="set-row">
                <button class="set-btn ${isDone ? 'done' : ''}" onclick="toggleSet('${id}', this)">${sIdx+1}</button>
                <input type="text" class="set-input" placeholder="Weight/Reps" value="${weight}" oninput="saveWeight('${id}', this.value)">
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
  updateProgress();
}

function toggleSet(id, btn) {
  const state = !btn.classList.contains('done');
  btn.classList.toggle('done');
  localStorage.setItem(id + '_done', state);
  if(state) startTimer();
  updateProgress();
}

function saveWeight(id, val) { localStorage.setItem(id + '_val', val); }

function addSet(exIdx) {
  const key = `f_p${currentPhase}w${currentWeek}d${currentDay}e${exIdx}_extras`;
  const curr = parseInt(localStorage.getItem(key)) || 0;
  localStorage.setItem(key, curr + 1);
  renderExercises();
}

function startTimer() {
  let time = 60;
  document.getElementById('timer-overlay').classList.add('show');
  timerInt = setInterval(() => {
    time--;
    document.getElementById('t-secs').innerText = time;
    if(time <= 0) stopTimer();
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInt);
  document.getElementById('timer-overlay').classList.remove('show');
  document.getElementById('t-secs').innerText = 60;
}

function updateProgress() {
  const total = document.querySelectorAll('.set-btn').length;
  const done = document.querySelectorAll('.set-btn.done').length;
  document.getElementById('progress-bar').style.width = total ? (done/total*100)+'%' : '0%';
}

function resetToday() {
  if(confirm("Clear today's checks? Weights will be kept.")) {
    Object.keys(localStorage).forEach(k => {
      if(k.includes(`p${currentPhase}w${currentWeek}d${currentDay}`) && k.endsWith('_done')) {
        localStorage.setItem(k, false);
      }
    });
    renderExercises();
  }
}

function resetAll() {
  if(confirm("WARNING: This will delete ALL progress, weights, and extra sets. Proceed?")) {
    localStorage.clear();
    location.reload();
  }
}

window.onload = updateUI;
</script>
</body>
</html>
