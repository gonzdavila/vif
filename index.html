<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dave's V.I.F. Program</title>
<style>
  @import url('https://googleapis.com');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0c0c0c;color:#f0f0f0;font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;padding-bottom:60px;min-height:100vh;}
  button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none;}
  a{font-family:'DM Sans',sans-serif;text-decoration:none;}
  .bebas{font-family:'Bebas Neue',sans-serif;}
  #header{background:#111;padding:18px 16px 12px;border-bottom:3px solid var(--c,#e8ff47);}
  .phase-tabs{display:flex;gap:6px;margin-top:14px;}
  .phase-tab{flex:1;padding:8px 4px;border:none;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;line-height:1.4;background:#222;color:#777;}
  .phase-tab.active{background:var(--c);color:#000;}
  .week-tabs{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:5px;}
  .week-tab{flex:0 0 45px;padding:6px 0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:#555;text-align:center;}
  .week-tab.active{background:#333;color:#fff;}
  #progress-wrap{padding:12px 16px 10px;background:#111;}
  #progress-bar-bg{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:6px;}
  #progress-bar{height:100%;background:var(--c);border-radius:3px;transition:width .3s;width:0%;}
  #day-tabs{display:flex;background:#111;border-top:1px solid rgba(255,255,255,.06);overflow-x:auto;}
  .day-tab{flex:0 0 80px;padding:12px 4px;background:transparent;border:none;border-bottom:2.5px solid transparent;font-size:11px;font-weight:600;color:#555;cursor:pointer;text-align:center;}
  .day-tab.active{color:var(--c);border-bottom-color:var(--c);}
  #exercises{padding:6px 16px 0;}
  .ex-card{margin-bottom:10px;background:rgba(255,255,255,.03);border-radius:12px;overflow:hidden;}
  .ex-header{padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .ex-name{font-weight:700;font-size:15px;color:#eee;}
  .ex-body{display:none;padding:12px;border-top:1px solid rgba(255,255,255,.05);}
  .ex-body.open{display:block;}
  .set-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .set-btn{width:40px;height:40px;border-radius:8px;font-size:13px;font-weight:700;background:#222;color:#fff;border:none;}
  .set-btn.done{background:var(--c);color:#000;}
  .set-val-input{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#f0f0f0;padding:8px;width:75px;text-align:center;font-weight:700;}
  .set-unit{font-size:11px;color:#666;font-weight:600;}
  .yt-btn{display:inline-flex;align-items:center;padding:8px 12px;background:#ff0000;color:#fff;border-radius:6px;font-size:11px;font-weight:700;margin-top:10px;}
  #timer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;flex-direction:column;align-items:center;justify-content:center;}
  #timer-overlay.show{display:flex;}
  #t-secs{font-size:100px;color:var(--c);line-height:1;}
  .admin-btns{padding:10px 16px;display:flex;justify-content:space-between;background:#111;font-size:10px;}
</style>
</head>
<body id="main-body">

<div id="timer-overlay">
  <div class="bebas" style="letter-spacing:4px; color:#666;">REST</div>
  <div id="t-secs" class="bebas">60</div>
  <button onclick="stopTimer()" style="background:rgba(255,255,255,0.1); color:#fff; padding:10px 20px; border-radius:8px; margin-top:20px; font-weight:700;">SKIP</button>
</div>

<div id="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="hbar" style="width:6px;height:30px;background:var(--c,#e8ff47);border-radius:3px;"></div>
    <div>
      <div id="phase-label" class="bebas" style="font-size:10px; color:var(--c,#e8ff47);">PHASE 1: VOLUME</div>
      <div id="week-day-title" class="bebas" style="font-size:24px;">WEEK 1 - DAY 1</div>
    </div>
  </div>
  <div class="phase-tabs" id="p-tabs"></div>
  <div class="week-tabs" id="w-tabs"></div>
</div>

<div class="admin-btns">
    <button onclick="resetDay()" style="background:none; color:#444; font-weight:700;">RESET DAY CHECKS</button>
    <button onclick="clearAll()" style="background:none; color:#622; font-weight:700;">CLEAR ALL DATA</button>
</div>

<div id="progress-wrap">
  <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:#666;text-transform:uppercase;">
    <span>Progreso del día</span>
    <span id="progress-text">0%</span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
</div>

<div id="day-tabs" class="day-tabs"></div>
<div id="exercises"></div>

<script>
// --- BASE DE DATOS COMPLETA (PHASE 1, 2, 3) ---
const workoutData = {
  phases: [
    { name: "PHASE 1: VOLUME", color: "#e8ff47", weeks: [1,2,3,4], days: [
      { name: "Day 1: Back & Traps", ex: [
        { n: "Pull Ups", s: 2, r: "AMAP", yt: "eGo4IYlbE5g" },
        { n: "Barbell Rows", s: 2, r: "10", yt: "6FZHJGzMFEc" },
        { n: "Seated Cable Rows", s: 2, r: "10", yt: "GZbfZ033f74" },
        { n: "Hyperextensions", s: 2, r: "10", yt: "5_EJEtllaiQ" },
        { n: "Upright Rows", s: 2, r: "10", yt: "um3VVzqunPU" },
        { n: "Dumbbell Shrugs", s: 2, r: "10", yt: "g6qbq4i1k8A" }
      ]},
      { name: "Day 2: Chest & Shoulders", ex: [
        { n: "Bench Press", s: 2, r: "10", yt: "rT7DgCr-3pg" },
        { n: "Incline DB Press", s: 2, r: "10", yt: "8iPEn5Jg02E" },
        { n: "Decline Pushups", s: 2, r: "AMAP", yt: "SKPab2YC8BE" },
        { n: "DB Military Press", s: 2, r: "10", yt: "B-aVuyhvLHU" },
        { n: "DB Rear Laterals", s: 2, r: "10", yt: "6yMdhi2DVao" }
      ]},
      { name: "Day 3: Legs", ex: [
        { n: "Squat", s: 2, r: "10", yt: "SW_C1A-rejs" },
        { n: "Leg Press", s: 2, r: "10", yt: "IZxyjW7MPJQ" },
        { n: "Stiff Leg Deadlift", s: 2, r: "10", yt: "jTMmrh727bw" },
        { n: "DB Step Ups", s: 2, r: "10", yt: "9ZKnX6_p76A" },
        { n: "Standing Calf Raise", s: 2, r: "10", yt: "YMmgq6Pa9Co" }
      ]},
      { name: "Day 4: Arms", ex: [
        { n: "Barbell Curls", s: 2, r: "10", yt: "QZEqB6wOLzQ" },
        { n: "Close Grip Bench", s: 2, r: "10", yt: "nEF0bv2FW94" },
        { n: "Lying Tricep Ext", s: 2, r: "10", yt: "mU_O_gBfUog" },
        { n: "Standing DB Curls", s: 2, r: "10", yt: "ykJmrZ5v0Z0" },
        { n: "Preacher Curls", s: 2, r: "10", yt: "vngli9L6QU0" },
        { n: "Tricep Kickbacks", s: 2, r: "10", yt: "6SS6K3lAwZ8" }
      ]}
    ]},
    { name: "PHASE 2: INTENSITY", color: "#00f2ff", weeks: [5,6,7,8], days: [
      { name: "Day 1: Upper Body", ex: [
        { n: "Pull Ups", s: 3, r: "AMAP", yt: "eGo4IYlbE5g" },
        { n: "Bench Press", s: 3, r: "8", yt: "rT7DgCr-3pg" },
        { n: "Military Press", s: 3, r: "8", yt: "B-aVuyhvLHU" },
        { n: "Barbell Shrug", s: 3, r: "8", yt: "fO_p3UatpB8" },
        { n: "Lying Tricep Ext", s: 3, r: "8", yt: "mU_O_gBfUog" },
        { n: "Hammer Curls", s: 3, r: "8", yt: "zC3nLlEvin4" }
      ]},
      { name: "Day 2: Lower Body", ex: [
        { n: "Squats", s: 3, r: "8", yt: "SW_C1A-rejs" },
        { n: "Stiff Legged Deadlifts", s: 3, r: "8", yt: "jTMmrh727bw" },
        { n: "Seated Calf Raises", s: 3, r: "8", yt: "857_m6m_e9M" },
        { n: "Weighted Crunches", s: 3, r: "8", yt: "P8pS8G_Y3Z0" },
        { n: "Cable Pull Ins", s: 3, r: "8", yt: "69XwA1O1uLg" }
      ]}
    ]},
    { name: "PHASE 3: FREQUENCY", color: "#ff3e64", weeks: [9,10,11,12], days: [
      { name: "Day 1: Full Body A", ex: [
        { n: "Squats", s: 2, r: "6", yt: "SW_C1A-rejs" },
        { n: "Stiff Leg Deadlifts", s: 2, r: "6", yt: "jTMmrh727bw" },
        { n: "DB Bench Press", s: 2, r: "6", yt: "rX9M6f525E0" }
      ]}
    ]}
  ]
};

let currentPhase = parseInt(localStorage.getItem('saved_phase')) || 0;
let currentWeek = parseInt(localStorage.getItem('saved_week')) || 0;
let currentDay = parseInt(localStorage.getItem('saved_day')) || 0;
let timer;

function init() {
  const pCont = document.getElementById('p-tabs');
  pCont.innerHTML = workoutData.phases.map((p,i) => `<button class="phase-tab ${i===currentPhase?'active':''}" onclick="setPhase(${i})">F${i+1}</button>`).join('');
  
  const dCont = document.getElementById('day-tabs');
  dCont.innerHTML = workoutData.phases[currentPhase].days.map((d,i) => `<button class="day-tab ${i===currentDay?'active':''}" onclick="setDay(${i})">DAY ${i+1}</button>`).join('');

  const wCont = document.getElementById('w-tabs');
  wCont.innerHTML = workoutData.phases[currentPhase].weeks.map((w,i) => `<button class="week-tab ${i===currentWeek?'active':''}" onclick="setWeek(${i})">W${w}</button>`).join('');

  updateUI();
}

function setPhase(i) { currentPhase = i; currentWeek = 0; currentDay = 0; saveState(); init(); }
function setWeek(i) { currentWeek = i; saveState(); init(); }
function setDay(i) { currentDay = i; saveState(); init(); }
function saveState() {
    localStorage.setItem('saved_phase', currentPhase);
    localStorage.setItem('saved_week', currentWeek);
    localStorage.setItem('saved_day', currentDay);
}

function updateUI() {
  const phase = workoutData.phases[currentPhase];
  const day = phase.days[currentDay];
  document.documentElement.style.setProperty('--c', phase.color);
  document.getElementById('phase-label').innerText = phase.name;
  document.getElementById('week-day-title').innerText = `WEEK ${phase.weeks[currentWeek]} - ${day.name}`;
  renderExercises();
}

function renderExercises() {
  const container = document.getElementById('exercises');
  const day = workoutData.phases[currentPhase].days[currentDay];
  
  container.innerHTML = day.ex.map((ex, exIdx) => {
    const extraKey = `extras_p${currentPhase}w${currentWeek}d${currentDay}e${exIdx}`;
    const extras = parseInt(localStorage.getItem(extraKey)) || 0;
    const totalSets = ex.s + extras;

    return `
    <div class="ex-card">
      <div class="ex-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="ex-name">${ex.n} <small style="color:#666; margin-left:10px;">${ex.r} Reps</small></span>
        <button class="add-set" onclick="event.stopPropagation();addExtra(${exIdx})" style="background:none; border:1px solid #444; color:#666; font-size:9px; padding:2px 6px; border-radius:4px;">+ SET</button>
      </div>
      <div class="ex-body">
        <a href="https://youtube.com{ex.yt}" target="_blank" class="yt-btn">WATCH VIDEO</a>
        ${Array.from({length: totalSets}).map((_, sIdx) => {
          const id = `vFinal_p${currentPhase}w${currentWeek}d${currentDay}e${exIdx}s${sIdx}`;
          const done = localStorage.getItem(id+'_done') === 'true';
          const val = localStorage.getItem(id+'_val') || '';
          return `
          <div class="set-row">
            <button class="set-btn ${done?'done':''}" onclick="toggleSet('${id}', this)">${sIdx+1}</button>
            <input type="text" class="set-val-input" placeholder="0" value="${val}" oninput="localStorage.setItem('${id}_val', this.value)">
            <span class="set-unit">Lbs</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  updateProgress();
}

function toggleSet(id, btn) {
  const state = !btn.classList.contains('done');
  btn.classList.toggle('done', state);
  localStorage.setItem(id+'_done', state);
  if(state) startTimer();
  updateProgress();
}

function addExtra(idx) {
  const key = `extras_p${currentPhase}w${currentWeek}d${currentDay}e${idx}`;
  localStorage.setItem(key, (parseInt(localStorage.getItem(key)) || 0) + 1);
  renderExercises();
}

function startTimer() {
  clearInterval(timer);
  let time = 60;
  document.getElementById('timer-overlay').classList.add('show');
  timer = setInterval(() => {
    time--;
    document.getElementById('t-secs').innerText = time;
    if(time <= 0) {
        stopTimer();
        if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
        new Audio('https://google.com').play();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timer);
  document.getElementById('timer-overlay').classList.remove('show');
}

function updateProgress() {
  const all = document.querySelectorAll('.set-btn').length;
  const done = document.querySelectorAll('.set-btn.done').length;
  const p = all ? Math.round((done/all)*100) : 0;
  document.getElementById('progress-bar').style.width = p+'%';
  document.getElementById('progress-text').innerText = p+'%';
}

function resetDay() {
    if(confirm("Reset checks for today?")) {
        Object.keys(localStorage).forEach(k => { if(k.includes(`p${currentPhase}w${currentWeek}d${currentDay}`) && k.endsWith('_done')) localStorage.removeItem(k); });
        renderExercises();
    }
}

function clearAll() { if(confirm("DELETE ALL?")) { localStorage.clear(); location.reload(); } }

window.onload = init;
</script>
</body>
</html>
