<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dave's V.I.F. Program</title>
<style>
  @import url('https://googleapis.com');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root { --c: #e8ff47; }
  body{background:#0c0c0c;color:#f0f0f0;font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;padding-bottom:60px;min-height:100vh;}
  button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none;}
  .bebas{font-family:'Bebas Neue',sans-serif;}
  
  /* HEADER & TABS */
  #header{background:#111;padding:18px 16px 12px;border-bottom:3px solid var(--c);}
  .phase-tabs{display:flex;gap:6px;margin-top:14px;}
  .phase-tab{flex:1;padding:8px 4px;border-radius:7px;font-size:10px;font-weight:700;background:#222;color:#777;}
  .phase-tab.active{background:var(--c);color:#000;}
  
  /* ADMIN & PROGRESS */
  .admin-bar{display:flex;justify-content:space-between;padding:8px 16px;background:#111;font-size:10px;}
  .btn-reset{color:#555;font-weight:700;background:none;}
  #progress-bar-bg{height:4px;background:rgba(255,255,255,.05);width:100%;}
  #progress-bar{height:100%;background:var(--c);transition:width .3s;width:0%;}

  /* EXERCISE CARDS */
  #exercises{padding:15px;}
  .ex-card{margin-bottom:12px;background:rgba(255,255,255,0.03);border-radius:12px;overflow:hidden;}
  .ex-header{padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .ex-img-mini{width:45px;height:45px;border-radius:6px;object-fit:cover;background:#1a1a1a;}
  .ex-name{font-weight:700;font-size:14px;flex:1;}
  
  .ex-body{display:none;padding:0 12px 12px;border-top:1px solid rgba(255,255,255,0.05);}
  .ex-body.open{display:block;}

  /* SETS */
  .set-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .set-btn{width:38px;height:38px;border-radius:8px;background:#222;color:#fff;font-weight:700;}
  .set-btn.done{background:var(--c);color:#000;}
  .set-input{background:#111;border:1px solid #333;color:#fff;padding:8px;border-radius:6px;width:85px;text-align:center;}
  
  /* TIMER OVERLAY */
  #timer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;flex-direction:column;align-items:center;justify-content:center;}
  #timer-overlay.show{display:flex;}
  #t-secs{font-size:80px;color:var(--c);}

  .yt-btn{display:inline-block;margin-top:10px;padding:8px 12px;background:#ff0000;color:#fff;border-radius:6px;font-size:11px;font-weight:700;}
</style>
</head>
<body>

<div id="timer-overlay">
  <div class="bebas" style="letter-spacing:3px; color:#888">REST</div>
  <div id="t-secs" class="bebas">60</div>
  <button onclick="stopTimer()" style="background:rgba(255,255,255,0.1); color:#fff; padding:10px 20px; border-radius:8px; margin-top:20px;">SKIP</button>
</div>

<div id="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="phase-color-bar" style="width:6px;height:30px;background:var(--c);border-radius:3px;"></div>
    <div>
      <div id="phase-title" class="bebas" style="font-size:10px; color:var(--c)">PHASE 1: VOLUME</div>
      <div id="day-title" class="bebas" style="font-size:24px;">DAY 1: BACK & TRAPS</div>
    </div>
  </div>
  <div class="phase-tabs">
    <button class="phase-tab" onclick="setPhase(1)">F1</button>
    <button class="phase-tab" onclick="setPhase(2)">F2</button>
    <button class="phase-tab" onclick="setPhase(3)">F3</button>
  </div>
</div>

<div class="admin-bar">
    <button class="btn-reset" onclick="resetDone()">RESET DONE</button>
    <button class="btn-reset" onclick="resetAll()">RESET ALL</button>
</div>
<div id="progress-bar-bg"><div id="progress-bar"></div></div>

<div id="day-tabs" style="display:flex; background:#111; overflow-x:auto;">
  <div class="day-tab" onclick="setDay(1)">DAY 1</div>
  <div class="day-tab" onclick="setDay(2)">DAY 2</div>
  <div class="day-tab" onclick="setDay(3)">DAY 3</div>
  <div class="day-tab" onclick="setDay(4)">DAY 4</div>
</div>

<div id="exercises"></div>

<script>
// --- DATA (Tu rutina completa del PDF) ---
const workoutData = {
    p1: {
        name: "PHASE 1: VOLUME", color: "#e8ff47",
        days: {
            1: { title: "BACK & TRAPS", ex: [
                {name: "Pull Ups", sets: 2, reps: "AMAP", yt: "https://youtu.be", img: "https://fitnessprogramer.com"},
                {name: "Barbell Rows", sets: 2, reps: "10", yt: "https://youtu.be", img: "https://fitnessprogramer.com"}
            ]},
            2: { title: "CHEST & SHOULDERS", ex: [
                {name: "Bench Press", sets: 2, reps: "10", yt: "https://youtu.be", img: "https://fitnessprogramer.com"}
            ]}
        }
    },
    p2: { name: "PHASE 2: INTENSITY", color: "#47fffa" },
    p3: { name: "PHASE 3: FREQUENCY", color: "#ff47eb" }
};

let currentPhase = parseInt(localStorage.getItem('v4_phase')) || 1;
let currentDay = parseInt(localStorage.getItem('v4_day')) || 1;
let timerInterval;

function init() {
    renderTabs();
    renderExercises();
}

function setPhase(p) {
    currentPhase = p;
    localStorage.setItem('v4_phase', p);
    renderTabs();
    renderExercises();
}

function setDay(d) {
    currentDay = d;
    localStorage.setItem('v4_day', d);
    renderTabs();
    renderExercises();
}

function renderTabs() {
    const pData = workoutData['p'+currentPhase];
    document.documentElement.style.setProperty('--c', pData.color);
    document.getElementById('phase-title').innerText = pData.name;
    
    document.querySelectorAll('.phase-tab').forEach((t, i) => t.className = (i + 1 == currentPhase) ? 'phase-tab active' : 'phase-tab');
    document.querySelectorAll('.day-tab').forEach((t, i) => t.className = (i + 1 == currentDay) ? 'day-tab active' : 'day-tab');
}

function renderExercises() {
    const container = document.getElementById('exercises');
    const phase = workoutData['p' + currentPhase];
    const day = phase.days ? phase.days[currentDay] : null;
    
    if(!day) {
        container.innerHTML = `<p style="text-align:center; padding:50px; color:#444">Coming Soon...</p>`;
        return;
    }

    document.getElementById('day-title').innerText = `DAY ${currentDay}: ${day.title}`;
    
    container.innerHTML = day.ex.map((ex, exIdx) => {
        const extraKey = `v4_p${currentPhase}d${currentDay}e${exIdx}_extras`;
        const extras = parseInt(localStorage.getItem(extraKey)) || 0;
        const totalSets = ex.sets + extras;

        return `
        <div class="ex-card">
            <div class="ex-header" onclick="this.nextElementSibling.classList.toggle('open')">
                <img src="${ex.img}" class="ex-img-mini">
                <div class="ex-name">${ex.name} <br><small style="color:#666">${ex.reps} Reps</small></div>
                <div style="font-size:12px; color:#444">▼</div>
            </div>
            <div class="ex-body">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <a href="${ex.yt}" target="_blank" class="yt-btn">WATCH ON YOUTUBE</a>
                    <button class="add-set-btn" onclick="addSet(${exIdx})">+ ADD SET</button>
                </div>
                ${Array.from({length: totalSets}).map((_, sIdx) => {
                    const id = `v4_p${currentPhase}d${currentDay}e${exIdx}s${sIdx}`;
                    const done = localStorage.getItem(id + '_done') === 'true';
                    const val = localStorage.getItem(id + '_val') || '';
                    return `
                    <div class="set-row">
                        <button class="set-btn ${done ? 'done' : ''}" onclick="toggleSet('${id}', this)">${sIdx+1}</button>
                        <input type="text" class="set-input" placeholder="Weight" value="${val}" oninput="saveVal('${id}', this.value)">
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }).join('');
    updateProgress();
}

function toggleSet(id, btn) {
    const isDone = !btn.classList.contains('done');
    btn.classList.toggle('done');
    localStorage.setItem(id + '_done', isDone);
    if(isDone) startTimer();
    updateProgress();
}

function saveVal(id, v) { localStorage.setItem(id + '_val', v); }

function addSet(idx) {
    const key = `v4_p${currentPhase}d${currentDay}e${idx}_extras`;
    localStorage.setItem(key, (parseInt(localStorage.getItem(key)) || 0) + 1);
    renderExercises();
}

function startTimer() {
    let timeLeft = 60;
    document.getElementById('timer-overlay').classList.add('show');
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('t-secs').innerText = timeLeft;
        if(timeLeft <= 0) stopTimer();
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
    document.getElementById('timer-overlay').classList.remove('show');
    document.getElementById('t-secs').innerText = 60;
}

function updateProgress() {
    const btns = document.querySelectorAll('.set-btn');
    const done = document.querySelectorAll('.set-btn.done');
    document.getElementById('progress-bar').style.width = btns.length ? (done.length/btns.length*100)+'%' : '0%';
}

function resetDone() {
    if(confirm("Reset today's checks?")) {
        Object.keys(localStorage).forEach(k => { if(k.includes(`p${currentPhase}d${currentDay}`) && k.endsWith('_done')) localStorage.setItem(k, false); });
        renderExercises();
    }
}

function resetAll() { if(confirm("DELETE EVERYTHING?")) { localStorage.clear(); location.reload(); } }

window.onload = init;
</script>
</body>
</html>
